<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicket - Iniciar Sesión / Registrarse</title>
    <link rel="stylesheet" href="estilosLogin.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">Clicket</div>
    </header>

    <main class="login-container">
        <form class="login-form" action="#" method="POST">
            
            <!-- Fila superior: Título y Selector de Rol a la derecha -->
            <div class="form-header-row">
                <h1>Registrar </h1>
                
                <div class="role-selector-top">
                    <label class="role-tab">
                        <input type="radio" name="rol" value="usuario" checked>
                        <span class="role-label">usuario</span>
                    </label>
                    <label class="role-tab">
                        <input type="radio" name="rol" value="admin">
                        <span class="role-label">admin</span>
                    </label>
                </div>
            </div>

            <!-- Banner de Alerta -->
            <div class="alert-banner">
                Debe verificar si existe un Administrador o crear el primero.
            </div>

            <!-- Campos del Formulario -->
            <div class="form-group">
                <label for="usuario">Usuario o Email</label>
                <input 
                    type="text" 
                    id="usuario" 
                    name="usuario" 
                    placeholder="Ingrese su usuario o email" 
                    required
                >
            </div>

                    <div class="form-group">
                <label for="name">Nombre</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Ingrese su nombre" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Apellido</label>
                <input 
                    type="text" 
                    id="apellido" 
                    name="apellido" 
                    placeholder="Ingrese su apellido" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="********" 
                    required
                >
            </div>

            <button type="submit" class="btn-submit" href="index.html">Ingresar</button>
            <div class="divider">
    <span>o</span>
</div>


            <a href="index.html" class="back-link">&larr; Volver al inicio</a>

        </form>
    </main>
